<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket Golf Printable</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛳</text></svg>">
<style>
  :root {
    --ink: #3f4442;
    --dot: #a9aeac;
    --fairway: #e4e7e5;
    --water: #79837d;
    --sand-line: #b7bcba;
    --paper: #ffffff;
    --cut: #c2c6c4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #d7dad8;
    font-family: "Avenir Next", "Century Gothic", Futura, "Trebuchet MS", -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
  }

  /* ------------------------------ controls ------------------------- */
  .controls {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 12px 18px;
    background: var(--ink);
    color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  .controls h1 {
    font-size: 16px;
    margin: 0 14px 0 0;
    font-weight: 700;
    letter-spacing: .04em;
  }
  .controls label { font-size: 12px; opacity: .85; margin-left: 6px; }
  .controls input, .controls select {
    font: inherit;
    font-size: 13px;
    padding: 5px 8px;
    border: none;
    border-radius: 6px;
  }
  .controls input#seed { width: 150px; }
  .controls button {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #fff;
    color: var(--ink);
  }
  .controls button.primary { background: #9fd6a8; }
  .controls .spacer { flex: 1; }

  /* ------------------------------ sheets --------------------------- */
  #sheets { padding: 24px 0 60px; }

  .sheet {
    position: relative;
    width: 8.5in;
    height: 11in;
    margin: 0 auto 24px;
    background: var(--paper);
    box-shadow: 0 3px 14px rgba(0,0,0,.22);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  }
  body.a4 .sheet { width: 210mm; height: 297mm; }

  /* dashed cut guides through the middle of the sheet */
  .sheet::before, .sheet::after {
    content: "";
    position: absolute;
    z-index: 1;
    pointer-events: none;
  }
  .sheet::before {
    left: 50%; top: 0; bottom: 0;
    border-left: 1px dashed var(--cut);
  }
  .sheet::after {
    top: 50%; left: 0; right: 0;
    border-top: 1px dashed var(--cut);
  }

  .quarter {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 0.28in 0.30in 0.24in;
  }

  /* ------------------------------ hole card ------------------------ */
  .hole-card svg { flex: 1; width: 100%; height: 0; min-height: 0; }

  .hole-footer {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 2px 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .hole-footer .blank {
    display: inline-block;
    width: 34px;
    border-bottom: 1.5px solid var(--ink);
    height: 1em;
    vertical-align: baseline;
  }
  .hole-footer .blank.wide { width: 44px; }

  /* ------------------------------ title card ----------------------- */
  .title-card { justify-content: space-between; text-align: center; }
  .title-card .flag { font-size: 34px; margin-top: .35in; }
  .title-card h2 {
    font-size: 24px;
    line-height: 1.15;
    margin: 8px 0 4px;
    letter-spacing: .02em;
  }
  .title-card .sub { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
  .title-card .seed { font-size: 10px; opacity: .55; margin-top: 4px; }

  .mulligans { margin: 14px 0 4px; }
  .mulligans .label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; margin-bottom: 6px; }
  .mulligans .pips { display: flex; justify-content: center; gap: 9px; }
  .mulligans .pip {
    width: 17px; height: 17px;
    border: 2px solid var(--ink);
    border-radius: 50%;
  }

  .legend {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px 14px;
    text-align: left;
    font-size: 10.5px;
    margin: 10px auto 0;
    max-width: 3.5in;
  }
  .legend .item { display: flex; align-items: center; gap: 7px; }
  .legend svg { flex: none; }
  .title-card .credit { font-size: 9px; opacity: .5; margin-top: 10px; }

  /* ------------------------------ scorecard ------------------------ */
  .score-card h3 {
    text-align: center;
    font-size: 16px;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin: 4px 0 2px;
  }
  .score-card .course-name { text-align: center; font-size: 11px; opacity: .7; margin-bottom: 10px; }
  .score-tables { display: flex; gap: 12px; flex: 1; }
  .score-tables table {
    flex: 1;
    border-collapse: collapse;
    font-size: 11px;
    height: min-content;
  }
  .score-tables th, .score-tables td {
    border: 1px solid var(--ink);
    padding: 3px 6px;
    text-align: center;
  }
  .score-tables th { background: var(--fairway); letter-spacing: .06em; }
  .score-tables td.stroke-cell { min-width: 40px; }
  .score-tables tr.sum td { font-weight: 700; background: var(--fairway); }
  .score-card .players {
    margin-top: 10px;
    font-size: 11px;
    display: grid;
    gap: 8px;
  }
  .score-card .players .line { border-bottom: 1.2px solid var(--ink); padding-top: 12px; }

  /* ------------------------------ play mode ------------------------ */
  #play { display: none; padding: 14px 10px 46px; }
  body.playing #play { display: block; }
  body.playing #sheets { display: none; }
  body.playing .print-only { display: none; }

  .play-wrap {
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    align-items: flex-start;
  }
  .play-board {
    flex: 1 1 340px;
    max-width: 480px;
    background: var(--paper);
    border-radius: 12px;
    box-shadow: 0 3px 14px rgba(0,0,0,.22);
    padding: 8px;
  }
  .play-board svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: calc(100dvh - 190px);
    touch-action: manipulation;
  }
  .play-board svg .target { cursor: pointer; }

  .play-side {
    flex: 1 1 260px;
    max-width: 480px;
    display: grid;
    gap: 10px;
    align-content: start;
  }
  .play-card {
    background: var(--paper);
    border-radius: 12px;
    box-shadow: 0 3px 14px rgba(0,0,0,.18);
    padding: 12px 14px;
  }
  .play-card h2 { font-size: 15px; margin: 0 0 2px; letter-spacing: .02em; }
  .play-card .sub { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .65; }

  .play-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    font-size: 13px;
    margin-top: 8px;
  }
  .play-stats b { font-size: 15px; }

  .play-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .play-actions button {
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    padding: 12px 16px;      /* generous tap targets for touch */
    border: none;
    border-radius: 9px;
    cursor: pointer;
    background: var(--fairway);
    color: var(--ink);
    min-height: 44px;
  }
  .play-actions button.primary { background: #9fd6a8; }
  .play-actions button.next { background: #f6d78c; }
  .play-actions button:disabled { opacity: .4; cursor: default; }
  #p-die {
    font-size: 40px;
    line-height: 1;
    min-width: 42px;
    text-align: center;
  }
  #p-msg { font-size: 13px; line-height: 1.45; min-height: 2.6em; }
  #p-msg b { font-size: 14px; }

  .score-strip { display: flex; flex-wrap: wrap; gap: 4px; }
  .score-strip .cell {
    width: 30px; height: 34px;
    border: 1.5px solid var(--dot);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 11px;
  }
  .score-strip .cell .n { font-size: 8px; opacity: .55; }
  .score-strip .cell.now { border-color: var(--ink); border-width: 2px; }
  .score-strip .cell.done { background: var(--fairway); font-weight: 700; }

  .play-summary { text-align: center; padding: 22px 14px; }
  .play-summary .flag { font-size: 40px; }
  .play-summary h2 { margin: 6px 0 2px; }
  .play-summary .big { font-size: 30px; font-weight: 700; margin: 10px 0 2px; }
  .play-summary .share-block {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed var(--dot);
  }
  .play-summary .seed-line { font-size: 12px; opacity: .7; margin: 6px 0 2px; }
  .play-summary table {
    border-collapse: collapse;
    margin: 14px auto 4px;
    font-size: 12px;
  }
  .play-summary th, .play-summary td { border: 1px solid var(--ink); padding: 3px 7px; }
  .play-summary th { background: var(--fairway); }

  /* phones: stack panels, keep the whole hole visible, and pin the
     roll/mulligan controls to the bottom of the screen */
  @media (max-width: 640px) {
    .controls { padding: 10px 12px; gap: 8px; }
    .controls h1 { flex-basis: 100%; margin: 0; }
    #play { padding-bottom: 160px; }
    .play-board { max-width: 100%; }
    .play-board svg { max-height: 62dvh; }
    .play-actions button { flex: 1 1 auto; }
    .play-card.actions {
      position: fixed;
      left: 8px; right: 8px;
      bottom: max(8px, env(safe-area-inset-bottom));
      z-index: 20;
      box-shadow: 0 4px 22px rgba(0,0,0,.35);
    }
  }

  /* ------------------------------ print ---------------------------- */
  @media print {
    body { background: #fff; }
    .controls { display: none; }
    #play { display: none !important; }
    body.playing #sheets { display: block; }
    #sheets { padding: 0; }
    .sheet {
      margin: 0;
      box-shadow: none;
      break-after: page;
    }
    .sheet:last-child { break-after: auto; }
  }
</style>
<style id="page-size">@page { size: letter; margin: 0; }</style>
</head>
<body>

<div class="controls">
  <h1>⛳ POCKET GOLF</h1>
  <label for="seed">Seed</label>
  <input id="seed" type="text" spellcheck="false">
  <button id="random">🎲 Random seed</button>
  <label for="theme">Style</label>
  <select id="theme"></select>
  <label for="diff">Difficulty</label>
  <select id="diff"></select>
  <label for="holes">Holes</label>
  <select id="holes">
    <option value="9">9</option>
    <option value="18" selected>18</option>
  </select>
  <label for="paper">Paper</label>
  <select id="paper">
    <option value="letter" selected>Letter</option>
    <option value="a4">A4</option>
  </select>
  <span class="spacer"></span>
  <button id="play-toggle">▶ Play</button>
  <button id="print" class="primary">🖨 Print</button>
</div>

<div id="sheets"></div>

<div id="play">
  <div class="play-wrap">
    <div class="play-board" id="p-board"></div>
    <div class="play-side">
      <div class="play-card">
        <h2 id="p-course"></h2>
        <div class="sub" id="p-holeinfo"></div>
        <div class="play-stats">
          <span>Strokes <b id="p-strokes">0</b>&thinsp;/&thinsp;6</span>
          <span>Total <b id="p-total">0</b></span>
          <span>Mulligans <b id="p-mull">6</b></span>
        </div>
      </div>
      <div class="play-card actions">
        <div class="play-actions">
          <button id="p-roll" class="primary">🎲 Roll</button>
          <span id="p-die"></span>
          <button id="p-mulligan" disabled>↩ Mulligan</button>
          <button id="p-next" class="next" hidden>Next hole ▸</button>
        </div>
        <p id="p-msg"></p>
      </div>
      <div class="play-card">
        <div class="score-strip" id="p-strip"></div>
      </div>
    </div>
  </div>
</div>

<script src="golf.js"></script>
<script>
'use strict';

/* ==================================================================== *
 *  SVG rendering                                                       *
 * ==================================================================== */

var G = window.PaperGolf;
var U = 20;      // grid unit in SVG user units
var PAD = 12;    // margin around the dot grid

function svgOpen(w, h, extra) {
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '"' + (extra || '') + '>';
}

var SAND_PATTERN =
  '<defs><pattern id="sandp" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">' +
  '<rect width="7" height="7" fill="#ffffff"/>' +
  '<line x1="0" y1="0" x2="0" y2="7" stroke="#b7bcba" stroke-width="2.4"/>' +
  '</pattern></defs>';

// Center of grid cell (x, y) in SVG coordinates.
function cx(x) { return PAD + (x + 0.5) * U; }
function cy(y) { return PAD + (y + 0.5) * U; }

// One terrain cell as a path with corners rounded only where the
// blob edge is exposed — adjacent same-type cells merge seamlessly.
function cellPath(hole, x, y, type) {
  function same(nx, ny) {
    return nx >= 0 && nx < hole.w && ny >= 0 && ny < hole.h &&
           hole.cells[ny * hole.w + nx] === type;
  }
  var L = same(x - 1, y), R = same(x + 1, y), Uu = same(x, y - 1), D = same(x, y + 1);
  var x0 = PAD + x * U, y0 = PAD + y * U, x1 = x0 + U, y1 = y0 + U;
  var r = 6;
  var tl = (!L && !Uu) ? r : 0, tr = (!R && !Uu) ? r : 0;
  var br = (!R && !D) ? r : 0, bl = (!L && !D) ? r : 0;
  return 'M' + (x0 + tl) + ' ' + y0 +
    'H' + (x1 - tr) + (tr ? 'a' + tr + ' ' + tr + ' 0 0 1 ' + tr + ' ' + tr : '') +
    'V' + (y1 - br) + (br ? 'a' + br + ' ' + br + ' 0 0 1 -' + br + ' ' + br : '') +
    'H' + (x0 + bl) + (bl ? 'a' + bl + ' ' + bl + ' 0 0 1 -' + bl + ' -' + bl : '') +
    'V' + (y0 + tl) + (tl ? 'a' + tl + ' ' + tl + ' 0 0 1 ' + tl + ' -' + tl : '') + 'Z';
}

function terrainLayer(hole, type, fill) {
  var d = '';
  for (var y = 0; y < hole.h; y++) {
    for (var x = 0; x < hole.w; x++) {
      if (hole.cells[y * hole.w + x] === type) d += cellPath(hole, x, y, type);
    }
  }
  return d ? '<path d="' + d + '" fill="' + fill + '"/>' : '';
}

function treeGlyph(x, y) {
  var X = cx(x), Y = cy(y), s = U * 0.42;
  return '<path fill="#4a4f4d" d="' +
    'M' + X + ' ' + (Y - s) +
    'L' + (X + s * 0.85) + ' ' + (Y + s * 0.55) +
    'L' + (X - s * 0.85) + ' ' + (Y + s * 0.55) + 'Z"/>' +
    '<rect x="' + (X - 1.6) + '" y="' + (Y + s * 0.55) + '" width="3.2" height="' + (s * 0.45) + '" fill="#4a4f4d"/>';
}

function slopeGlyph(x, y, dir) {
  var X = cx(x), Y = cy(y), s = U * 0.30;
  var d = G.DIRS[dir];
  var tipX = X + d[0] * s, tipY = Y + d[1] * s;
  var tailX = X - d[0] * s, tailY = Y - d[1] * s;
  // arrowhead wings perpendicular to direction
  var px = -d[1], py = d[0];
  var w = s * 0.55, back = s * 0.35;
  var h1x = tipX - d[0] * back + px * w, h1y = tipY - d[1] * back + py * w;
  var h2x = tipX - d[0] * back - px * w, h2y = tipY - d[1] * back - py * w;
  return '<g stroke="#8d938f" stroke-width="2.4" stroke-linecap="round" fill="none">' +
    '<line x1="' + tailX + '" y1="' + tailY + '" x2="' + tipX + '" y2="' + tipY + '"/>' +
    '<polyline points="' + h1x + ',' + h1y + ' ' + tipX + ',' + tipY + ' ' + h2x + ',' + h2y + '"/></g>';
}

// Wonder glyphs — small, quiet marks meant to be hunted, not noticed.
// All keyed by the wonder keys in golf.js.
var WONDER_GLYPHS = {
  bigfoot: function (x, y) {
    var X = cx(x), Y = cy(y);
    var g = '<g fill="#6d736f">';
    // two tiny footprints, slightly offset
    [[-3.5, 2, -18], [3.5, -3, -12]].forEach(function (f) {
      var fx = X + f[0], fy = Y + f[1];
      g += '<g transform="translate(' + fx + ' ' + fy + ') rotate(' + f[2] + ')">' +
        '<ellipse cx="0" cy="1.4" rx="2.5" ry="3.6"/>' +
        '<circle cx="-1.5" cy="-3.4" r="0.85"/><circle cx="-0.3" cy="-4" r="0.85"/>' +
        '<circle cx="1" cy="-3.7" r="0.85"/><circle cx="2" cy="-2.9" r="0.8"/></g>';
    });
    return g + '</g>';
  },
  gnome: function (x, y) {
    var X = cx(x), Y = cy(y);
    // pointy hat, round face, little body
    return '<g fill="#6d736f">' +
      '<path d="M' + X + ' ' + (Y - 6.2) +
        'L' + (X + 2.7) + ' ' + (Y - 0.8) +
        'L' + (X - 2.7) + ' ' + (Y - 0.8) + 'Z"/>' +
      '<circle cx="' + X + '" cy="' + (Y + 0.9) + '" r="1.7"/>' +
      '<path d="M' + (X - 2.4) + ' ' + (Y + 6) +
        'a2.4 3.2 0 0 1 4.8 0Z"/></g>';
  },
  castle: function (x, y) {
    var X = cx(x), Y = cy(y);
    function tower(tx) {
      return '<path d="M' + (tx - 1.6) + ' ' + (Y + 5) +
        'V' + (Y - 4) + 'h1v1.4h1.2v-1.4h1' +
        'V' + (Y + 5) + 'Z"/>';
    }
    // two crenellated towers and a wall with a gate arch
    return '<g fill="#6d736f">' + tower(X - 4.4) + tower(X + 4.4) +
      '<path d="M' + (X - 2.8) + ' ' + (Y + 5) + 'V' + (Y - 0.5) +
        'H' + (X + 2.8) + 'V' + (Y + 5) +
        'H' + (X + 1.4) + 'V' + (Y + 2.4) +
        'a1.4 1.7 0 0 0 -2.8 0V' + (Y + 5) + 'Z"/></g>';
  },
  ufo: function (x, y) {
    var X = cx(x), Y = cy(y);
    // saucer, dome, and a dotted beam
    return '<g fill="#6d736f">' +
      '<ellipse cx="' + X + '" cy="' + (Y - 1) + '" rx="5" ry="1.8"/>' +
      '<path d="M' + (X - 2.3) + ' ' + (Y - 2.2) +
        'a2.3 2.3 0 0 1 4.6 0Z"/>' +
      '<circle cx="' + (X - 1.6) + '" cy="' + (Y + 2.2) + '" r="0.75"/>' +
      '<circle cx="' + X + '" cy="' + (Y + 3.6) + '" r="0.75"/>' +
      '<circle cx="' + (X + 1.6) + '" cy="' + (Y + 2.2) + '" r="0.75"/></g>';
  },
  kraken: function (x, y) {
    var X = cx(x), Y = cy(y);
    // pale tentacles breaking the water, eyes on the head
    return '<g stroke="#e9ece9" fill="none" stroke-width="1.7" stroke-linecap="round">' +
      '<path d="M' + (X - 4.6) + ' ' + (Y + 4) +
        'Q' + (X - 6.4) + ' ' + Y + ' ' + (X - 4.4) + ' ' + (Y - 2.6) + '"/>' +
      '<path d="M' + (X + 4.6) + ' ' + (Y + 4) +
        'Q' + (X + 6.4) + ' ' + Y + ' ' + (X + 4.4) + ' ' + (Y - 2.6) + '"/></g>' +
      '<path fill="#e9ece9" d="M' + (X - 2.8) + ' ' + (Y + 2.2) +
        'a2.8 3 0 0 1 5.6 0Z"/>' +
      '<circle cx="' + (X - 1.1) + '" cy="' + (Y + 0.9) + '" r="0.7" fill="#3f4442"/>' +
      '<circle cx="' + (X + 1.1) + '" cy="' + (Y + 0.9) + '" r="0.7" fill="#3f4442"/>';
  }
};

// The cup: a ring at the cell with a flagstick rising from it.
function flagGlyph(x, y) {
  var X = cx(x), Y = cy(y);
  var top = Y - U * 0.95;
  return '<circle cx="' + X + '" cy="' + Y + '" r="' + (U * 0.22) +
      '" fill="#ffffff" stroke="#3f4442" stroke-width="2.8"/>' +
    '<line x1="' + X + '" y1="' + (Y - U * 0.18) + '" x2="' + X + '" y2="' + top +
      '" stroke="#3f4442" stroke-width="2.2" stroke-linecap="round"/>' +
    '<path fill="#3f4442" d="M' + X + ' ' + top +
      'L' + (X + U * 0.62) + ' ' + (top + U * 0.24) +
      'L' + X + ' ' + (top + U * 0.48) + 'Z"/>';
}

function renderHoleSVG(hole) {
  var wpx = hole.w * U + PAD * 2;
  var hpx = hole.h * U + PAD * 2;
  var s = svgOpen(wpx, hpx, ' preserveAspectRatio="xMidYMid meet"');
  s += SAND_PATTERN;

  // terrain blobs (fairway under everything, then green, sand, water)
  s += terrainLayer(hole, G.FAIRWAY, 'var(--fairway, #e4e7e5)');
  s += terrainLayer(hole, G.GREEN, '#c9d2cc');
  s += terrainLayer(hole, G.SAND, 'url(#sandp)');
  s += terrainLayer(hole, G.WATER, '#79837d');

  // dot grid — white dots on water, none under trees, gray elsewhere
  var gray = '', white = '';
  for (var y = 0; y < hole.h; y++) {
    for (var x = 0; x < hole.w; x++) {
      var t = hole.cells[y * hole.w + x];
      if (t === G.TREE) continue;
      if (hole.slope[y * hole.w + x] >= 0) continue;
      var dot = '<circle cx="' + cx(x) + '" cy="' + cy(y) + '" r="1.7"/>';
      if (t === G.WATER) white += dot; else gray += dot;
    }
  }
  s += '<g fill="#a9aeac">' + gray + '</g><g fill="#ffffff">' + white + '</g>';

  // trees, slopes, and any hidden wonder
  for (y = 0; y < hole.h; y++) {
    for (x = 0; x < hole.w; x++) {
      var k = y * hole.w + x;
      if (hole.cells[k] === G.TREE) s += treeGlyph(x, y);
      else if (hole.slope[k] >= 0) s += slopeGlyph(x, y, hole.slope[k]);
    }
  }
  if (hole.wonder) s += WONDER_GLYPHS[hole.wonder.key](hole.wonder.x, hole.wonder.y);

  // tee (solid) and cup (flagstick)
  s += '<circle cx="' + cx(hole.tee.x) + '" cy="' + cy(hole.tee.y) + '" r="' + (U * 0.30) + '" fill="#3f4442"/>';
  s += flagGlyph(hole.hole.x, hole.hole.y);

  return s + '</svg>';
}

/* ==================================================================== *
 *  Quarter-page cards                                                  *
 * ==================================================================== */

function holeCard(hole, num) {
  var div = document.createElement('div');
  div.className = 'quarter hole-card';
  div.innerHTML =
    renderHoleSVG(hole) +
    '<div class="hole-footer">' +
    '<span>Hole ' + num + '</span>' +
    '<span>Strokes: <span class="blank"></span>&thinsp;/ 6</span>' +
    '<span>Total: <span class="blank wide"></span></span>' +
    '</div>';
  return div;
}

function legendIcon(kind) {
  var s = svgOpen(22, 22, ' width="20" height="20"');
  switch (kind) {
    case 'fairway': s += SAND_PATTERN + '<rect x="2" y="2" width="18" height="18" rx="5" fill="#e4e7e5"/><circle cx="11" cy="11" r="1.6" fill="#a9aeac"/>'; break;
    case 'green':   s += '<rect x="2" y="2" width="18" height="18" rx="5" fill="#c9d2cc"/><circle cx="11" cy="11" r="1.6" fill="#a9aeac"/>'; break;
    case 'rough':   s += '<circle cx="6" cy="6" r="1.6" fill="#a9aeac"/><circle cx="16" cy="6" r="1.6" fill="#a9aeac"/><circle cx="6" cy="16" r="1.6" fill="#a9aeac"/><circle cx="16" cy="16" r="1.6" fill="#a9aeac"/>'; break;
    case 'sand':    s += SAND_PATTERN + '<rect x="2" y="2" width="18" height="18" rx="5" fill="url(#sandp)" stroke="#c9cdcb"/>'; break;
    case 'water':   s += '<rect x="2" y="2" width="18" height="18" rx="5" fill="#79837d"/><circle cx="11" cy="11" r="1.6" fill="#fff"/>'; break;
    case 'tree':    s += '<path fill="#4a4f4d" d="M11 3 L18 15 L4 15 Z"/><rect x="10" y="15" width="2.4" height="4" fill="#4a4f4d"/>'; break;
    case 'slope':   s += '<g stroke="#8d938f" stroke-width="2.2" stroke-linecap="round" fill="none"><line x1="5" y1="11" x2="17" y2="11"/><polyline points="13,6.5 17,11 13,15.5"/></g>'; break;
    case 'tee':     s += '<circle cx="11" cy="11" r="5.5" fill="#3f4442"/>'; break;
    case 'cup':     s += '<circle cx="9" cy="17" r="3.4" fill="#fff" stroke="#3f4442" stroke-width="2.2"/><line x1="9" y1="14.5" x2="9" y2="3.5" stroke="#3f4442" stroke-width="2" stroke-linecap="round"/><path fill="#3f4442" d="M9 3.5 L18 7 L9 10.5 Z"/>'; break;
  }
  return s + '</svg>';
}

function starString(rating) {
  return '★★★'.slice(0, rating) + '☆☆☆'.slice(0, 3 - rating);
}

function titleCard(course) {
  var div = document.createElement('div');
  div.className = 'quarter title-card';
  var pips = '';
  for (var i = 0; i < course.mulligans; i++) pips += '<div class="pip"></div>';
  var legend =
    '<div class="item">' + legendIcon('tee') + 'Tee — start here</div>' +
    '<div class="item">' + legendIcon('cup') + 'Hole — get in!</div>' +
    '<div class="item">' + legendIcon('fairway') + 'Fairway (+1 roll)</div>' +
    '<div class="item">' + legendIcon('green') + 'Green (putt 1&ndash;2)</div>' +
    '<div class="item">' + legendIcon('rough') + 'Rough (exact roll)</div>' +
    '<div class="item">' + legendIcon('sand') + 'Sand (−1 roll)</div>' +
    '<div class="item">' + legendIcon('water') + 'Water (never land)</div>' +
    '<div class="item">' + legendIcon('tree') + 'Trees (block hits)</div>' +
    '<div class="item">' + legendIcon('slope') + 'Slope (ball rolls)</div>';
  div.innerHTML =
    '<div>' +
      '<div class="flag">⛳</div>' +
      '<h2>' + course.name + '</h2>' +
      '<div class="sub">' + course.holes.length + ' holes &middot; Par ' + course.par +
        ' &middot; ' + course.themeLabel + '</div>' +
      '<div class="sub" style="margin-top:2px">' + starString(course.rating) + ' ' +
        course.difficultyLabel + '</div>' +
      '<div class="seed">seed: ' + course.seed + '</div>' +
    '</div>' +
    '<div>' +
      '<div class="mulligans"><div class="label">Mulligans</div><div class="pips">' + pips + '</div></div>' +
      '<div class="legend">' + legend + '</div>' +
    '</div>' +
    '<div class="credit">Move 1&ndash;6 spaces (d6) in a straight line, 8 directions. Par 6 every hole.<br>' +
    'On the green, putts may move 1 or 2 spaces.<br>' +
    'Inspired by Paper Apps&trade; GOLF by Tom Brinton.</div>';
  return div;
}

function scoreCard(course) {
  var div = document.createElement('div');
  div.className = 'quarter score-card';
  var n = course.holes.length;

  function table(from, to, sumLabel) {
    var rows = '';
    for (var i = from; i <= to; i++) {
      rows += '<tr><td>' + i + '</td><td>6</td><td class="stroke-cell"></td></tr>';
    }
    rows += '<tr class="sum"><td>' + sumLabel + '</td><td>' + (to - from + 1) * 6 + '</td><td class="stroke-cell"></td></tr>';
    return '<table><tr><th>Hole</th><th>Par</th><th>Strokes</th></tr>' + rows + '</table>';
  }

  var tables = n > 9
    ? table(1, 9, 'Out') + table(10, n, 'In')
    : table(1, n, 'Total');

  div.innerHTML =
    '<h3>Scorecard</h3>' +
    '<div class="course-name">' + course.name + ' &middot; Par ' + course.par + '</div>' +
    '<div class="score-tables">' + tables + '</div>' +
    '<div class="players">' +
      '<div class="line">Player</div>' +
      '<div class="line">Date</div>' +
    '</div>';
  return div;
}

/* ==================================================================== *
 *  Play mode — play the course on screen with a virtual d6             *
 * ==================================================================== */

var SVG_NS = 'http://www.w3.org/2000/svg';
var DIE_FACES = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
var play = null; // null when in print view; round state while playing

function el(id) { return document.getElementById(id); }

function svgNode(name, attrs) {
  var n = document.createElementNS(SVG_NS, name);
  for (var k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

function setMsg(html) { el('p-msg').innerHTML = html; }

function scoreName(strokes) {
  if (strokes === 1) return 'Hole-in-one!!';
  var d = strokes - 6;
  if (d <= -4) return 'Condor!?';
  if (d === -3) return 'Albatross!';
  if (d === -2) return 'Eagle!';
  if (d === -1) return 'Birdie!';
  if (d === 0) return 'Par';
  if (d === 1) return 'Bogey';
  if (d === 2) return 'Double bogey';
  return d + ' over par';
}

function terrainNote(t) {
  if (t === G.FAIRWAY) return 'On the fairway — next roll gets +1, and you may hit over trees.';
  if (t === G.SAND) return 'In the sand — next roll takes −1.';
  if (t === G.GREEN) return 'On the green — putts may move 1 or 2 spaces.';
  return 'In the rough — move exactly your next roll.';
}

function startPlay() {
  var seed = el('seed').value.trim() || 'pocket-golf';
  play = {
    course: G.generateCourse(seed, parseInt(el('holes').value, 10), el('theme').value, el('diff').value),
    hi: 0, scores: [], wonderFound: null,
    ball: null, strokes: 0, roll: null, rollSwing: 0, moves: null,
    segments: [], over: false
  };
  play.mulligans = play.course.mulligans;
  document.body.classList.add('playing');
  el('play-toggle').textContent = '✕ Exit play';
  el('p-course').textContent = play.course.name;
  syncURL();
  beginHole(0);
}

function exitPlay() {
  play = null;
  document.body.classList.remove('playing');
  el('play-toggle').textContent = '▶ Play';
  syncURL();
}

function curHole() { return play.course.holes[play.hi]; }

function beginHole(i) {
  play.hi = i;
  var hole = curHole();
  play.ball = { x: hole.tee.x, y: hole.tee.y };
  play.strokes = 0;
  play.roll = null;
  play.moves = null;
  play.segments = [];
  play.over = false;
  el('p-die').textContent = '';
  el('p-next').hidden = true;
  renderBoard();
  setMsg('Roll the die, then tap a highlighted spot to hit the ball there. ' +
    'Solid rings are your full shot; dashed rings are putts.');
  updateHUD();
}

function renderBoard() {
  var board = el('p-board');
  board.innerHTML = renderHoleSVG(curHole());
  play.svg = board.querySelector('svg');
  play.overlay = svgNode('g', {});
  play.svg.appendChild(play.overlay);
  // One tap handler on the whole board, resolved by coordinate: iOS
  // Safari doesn't reliably fire click events on dynamically inserted
  // SVG children, and per-circle hit areas are small on phones anyway.
  play.svg.addEventListener('click', boardTap);
  redrawOverlay();
}

// What spotting each wonder says, and how the share text brags about it.
var WONDER_TEXT = {
  bigfoot: { found: 'You spotted Bigfoot!', brag: 'I even spotted Bigfoot 🦶' },
  gnome:   { found: 'You found the garden gnome!', brag: 'I even found the garden gnome 🍄' },
  castle:  { found: 'You discovered the old castle!', brag: 'I even found the old castle 🏰' },
  ufo:     { found: 'A UFO hovers overhead!', brag: 'I even saw a UFO 🛸' },
  kraken:  { found: 'The kraken surfaces!', brag: 'I even saw the kraken 🐙' }
};

// Map a tap/click on the board to a legal move (with a little
// finger-slop tolerance when the nearest target is unambiguous),
// or to the hole's hidden wonder for the free mulligan.
function boardTap(evt) {
  if (!play) return;
  var pt = play.svg.createSVGPoint();
  pt.x = evt.clientX;
  pt.y = evt.clientY;
  var p = pt.matrixTransform(play.svg.getScreenCTM().inverse());
  function distTo(gx, gy) {
    var dx = (p.x - cx(gx)) / U, dy = (p.y - cy(gy)) / U;
    return Math.sqrt(dx * dx + dy * dy);
  }

  if (play.moves) {
    var best = null, bestD = Infinity, second = Infinity;
    play.moves.forEach(function (m) {
      var d = distTo(m.x, m.y);
      if (d < bestD) { second = bestD; bestD = d; best = m; }
      else if (d < second) second = d;
    });
    if (best && (bestD <= 0.5 || (bestD <= 1.1 && second > 1.4))) {
      applyMove(best);
      return;
    }
  }

  var hole = curHole();
  if (hole.wonder && !play.wonderFound && distTo(hole.wonder.x, hole.wonder.y) <= 0.8) {
    play.wonderFound = hole.wonder.key;
    play.mulligans++;
    setMsg('<b>' + WONDER_TEXT[hole.wonder.key].found + '</b> Free mulligan earned.');
    updateHUD();
  }
}

function redrawOverlay() {
  var o = play.overlay;
  while (o.firstChild) o.removeChild(o.firstChild);

  // pencil trail of the shots so far (dashed part = slope carry)
  play.segments.forEach(function (s) {
    o.appendChild(svgNode('line', {
      x1: cx(s.from[0]), y1: cy(s.from[1]), x2: cx(s.land[0]), y2: cy(s.land[1]),
      stroke: '#3f4442', 'stroke-width': 2.2, 'stroke-linecap': 'round',
      opacity: 0.75, 'pointer-events': 'none'
    }));
    if (s.rest[0] !== s.land[0] || s.rest[1] !== s.land[1]) {
      o.appendChild(svgNode('line', {
        x1: cx(s.land[0]), y1: cy(s.land[1]), x2: cx(s.rest[0]), y2: cy(s.rest[1]),
        stroke: '#3f4442', 'stroke-width': 2.2, 'stroke-dasharray': '3 4',
        'stroke-linecap': 'round', opacity: 0.75, 'pointer-events': 'none'
      }));
    }
    o.appendChild(svgNode('circle', {
      cx: cx(s.rest[0]), cy: cy(s.rest[1]), r: 2.6,
      fill: '#3f4442', 'pointer-events': 'none'
    }));
  });

  // legal landing spots for the current roll
  if (play.moves) {
    play.moves.forEach(function (m) {
      var putt = m.dist !== play.rollSwing;
      o.appendChild(svgNode('circle', {
        cx: cx(m.x), cy: cy(m.y), r: U * 0.44,
        fill: 'rgba(159,214,168,.55)', stroke: '#4f8f5c',
        'stroke-width': putt ? 1.4 : 2.4,
        'stroke-dasharray': putt ? '3 3' : 'none',
        'class': 'target'
      }));
    });
  }

  // the ball
  if (!play.over) {
    o.appendChild(svgNode('circle', {
      cx: cx(play.ball.x), cy: cy(play.ball.y), r: U * 0.26,
      fill: '#f5c452', stroke: '#3f4442', 'stroke-width': 2,
      'pointer-events': 'none'
    }));
  }
}

function doRoll(isMulligan) {
  if (!play || play.over || (play.moves && !isMulligan)) return;
  var hole = curHole();
  var roll = 1 + Math.floor(Math.random() * 6);
  var t = hole.cells[play.ball.y * hole.w + play.ball.x];
  var swing = roll + (t === G.FAIRWAY ? 1 : t === G.SAND ? -1 : 0);
  var moves = G.movesForRoll(hole, play.ball.x, play.ball.y, roll);
  el('p-die').textContent = DIE_FACES[roll - 1];
  if (!moves.length) {
    play.roll = null;
    play.moves = null;
    setMsg('Rolled ' + roll + ' — no legal shot anywhere! Roll again, no charge.');
  } else {
    play.roll = roll;
    play.rollSwing = swing;
    play.moves = moves;
    var mod = t === G.FAIRWAY ? ' +1 (fairway) → move ' + swing :
              t === G.SAND ? ' −1 (sand) → move ' + swing : ' → move ' + swing;
    setMsg('Rolled <b>' + roll + '</b>' + mod +
      (swing < 1 ? '. No swing reaches anywhere — putt instead.' : ', or take a putt.'));
  }
  redrawOverlay();
  updateHUD();
}

function applyMove(m) {
  if (!play || play.over) return;
  var hole = curHole();
  play.strokes++;
  play.segments.push({ from: [play.ball.x, play.ball.y], land: [m.x, m.y], rest: [m.rx, m.ry] });
  var slid = m.rx !== m.x || m.ry !== m.y;
  play.ball = { x: m.rx, y: m.ry };
  play.roll = null;
  play.moves = null;
  el('p-die').textContent = '';
  if (play.ball.x === hole.hole.x && play.ball.y === hole.hole.y) {
    holeOut();
  } else {
    var t = hole.cells[play.ball.y * hole.w + play.ball.x];
    setMsg((slid ? 'The slope carries the ball along! ' : '') + terrainNote(t));
  }
  redrawOverlay();
  updateHUD();
}

function holeOut() {
  play.over = true;
  play.scores[play.hi] = play.strokes;
  setMsg('<b>' + scoreName(play.strokes) + '</b> — in the cup in ' + play.strokes +
    (play.strokes === 1 ? ' stroke.' : ' strokes.'));
  var next = el('p-next');
  next.hidden = false;
  next.textContent = play.hi < play.course.holes.length - 1 ? 'Next hole ▸' : '🏁 Final results';
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// Round result as words, e.g. "92 (2 over par)".
function roundResult() {
  var total = play.scores.reduce(function (a, b) { return a + b; }, 0);
  var d = total - play.course.par;
  var vs = d === 0 ? 'even par' : d > 0 ? d + ' over par' : (-d) + ' under par';
  return { total: total, vs: vs };
}

// Link that drops the recipient straight into a round of this course.
function shareLink() {
  var params = new URLSearchParams();
  params.set('seed', play.course.seed);
  params.set('theme', play.course.theme);
  params.set('diff', play.course.difficulty);
  params.set('holes', String(play.course.holes.length));
  params.set('play', '1');
  return location.origin + location.pathname + '?' + params.toString();
}

function shareRound() {
  var r = roundResult();
  var text = 'I shot ' + r.total + ' (' + r.vs + ') on ' + play.course.name +
    ' (' + starString(play.course.rating) + ' ' + play.course.difficultyLabel + ')' +
    ' — Pocket Golf, seed "' + play.course.seed + '".' +
    (play.wonderFound ? ' ' + WONDER_TEXT[play.wonderFound].brag + '.' : '') +
    ' Think you can beat it?';
  var url = shareLink();
  var btn = el('p-share');
  function flash(label) {
    btn.textContent = label;
    setTimeout(function () { btn.textContent = '📣 Share'; }, 2000);
  }
  function copyFallback() {
    var full = text + '\n' + url;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(full).then(
        function () { flash('✓ Copied!'); },
        function () { flash('Copy failed'); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = full;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      flash(ok ? '✓ Copied!' : 'Copy failed');
    }
  }
  if (navigator.share) {
    navigator.share({ title: 'Pocket Golf', text: text, url: url })
      .catch(function (err) {
        // AbortError = user closed the share sheet; anything else,
        // fall back to the clipboard so the tap still does something.
        if (err && err.name !== 'AbortError') copyFallback();
      });
  } else {
    copyFallback();
  }
}

function showSummary() {
  var n = play.course.holes.length;
  var r = roundResult();
  var head = '', row = '';
  for (var i = 0; i < n; i++) {
    head += '<th>' + (i + 1) + '</th>';
    row += '<td>' + play.scores[i] + '</td>';
  }
  el('p-board').innerHTML =
    '<div class="play-summary">' +
    '<div class="flag">🏆</div>' +
    '<h2>' + play.course.name + '</h2>' +
    '<div class="sub">Round complete</div>' +
    '<div class="big">' + r.total + '</div>' +
    '<div>' + r.vs + ' (par ' + play.course.par + ')</div>' +
    '<div style="overflow-x:auto"><table><tr><th>Hole</th>' + head + '</tr>' +
    '<tr><td>Strokes</td>' + row + '</tr></table></div>' +
    '<div class="share-block">' +
    '<div class="sub">Challenge a friend</div>' +
    '<div class="seed-line">seed: <b>' + escapeHTML(play.course.seed) + '</b></div>' +
    '<div class="play-actions" style="justify-content:center;margin-top:10px">' +
    '<button id="p-share" class="primary">📣 Share</button>' +
    '<button id="p-again">⟳ Play again</button>' +
    '<button id="p-exit">Back to print view</button></div>' +
    '</div>' +
    '</div>';
  el('p-next').hidden = true;
  setMsg('');
  el('p-share').addEventListener('click', shareRound);
  el('p-again').addEventListener('click', function () { startPlay(); });
  el('p-exit').addEventListener('click', exitPlay);
}

function updateHUD() {
  var n = play.course.holes.length;
  el('p-holeinfo').textContent = 'Hole ' + (play.hi + 1) + ' of ' + n + ' · Par 6';
  el('p-strokes').textContent = play.strokes;
  var total = play.scores.reduce(function (a, b) { return a + (b || 0); }, 0);
  el('p-total').textContent = total + (play.over ? 0 : play.strokes);
  el('p-mull').textContent = play.mulligans;
  el('p-roll').disabled = play.over || !!play.moves;
  el('p-mulligan').disabled = play.over || !play.moves || play.mulligans < 1;
  var strip = el('p-strip');
  strip.innerHTML = '';
  for (var i = 0; i < n; i++) {
    var c = document.createElement('div');
    c.className = 'cell' +
      (i === play.hi && !play.over ? ' now' : '') +
      (play.scores[i] != null ? ' done' : '');
    c.innerHTML = '<span class="n">' + (i + 1) + '</span><span>' +
      (play.scores[i] != null ? play.scores[i] : '·') + '</span>';
    strip.appendChild(c);
  }
}

el('play-toggle').addEventListener('click', function () {
  if (play) exitPlay(); else startPlay();
});
el('p-roll').addEventListener('click', function () { doRoll(false); });
el('p-mulligan').addEventListener('click', function () {
  if (!play || !play.moves || play.mulligans < 1) return;
  play.mulligans--;
  doRoll(true);
});
el('p-next').addEventListener('click', function () {
  if (!play) return;
  if (play.hi < play.course.holes.length - 1) beginHole(play.hi + 1);
  else showSummary();
});

/* ==================================================================== *
 *  Page assembly                                                       *
 * ==================================================================== */

function syncURL() {
  var params = new URLSearchParams();
  params.set('seed', document.getElementById('seed').value.trim() || 'pocket-golf');
  params.set('theme', document.getElementById('theme').value);
  params.set('diff', document.getElementById('diff').value);
  params.set('holes', document.getElementById('holes').value);
  if (play) params.set('play', '1');
  history.replaceState(null, '', '?' + params.toString());
}

function rebuild() {
  var seed = document.getElementById('seed').value.trim() || 'pocket-golf';
  var numHoles = parseInt(document.getElementById('holes').value, 10);
  var theme = document.getElementById('theme').value;
  var course = G.generateCourse(seed, numHoles, theme, document.getElementById('diff').value);
  syncURL();

  var quarters = [titleCard(course)];
  course.holes.forEach(function (h, i) { quarters.push(holeCard(h, i + 1)); });
  quarters.push(scoreCard(course));

  var sheets = document.getElementById('sheets');
  sheets.innerHTML = '';
  for (var i = 0; i < quarters.length; i += 4) {
    var sheet = document.createElement('div');
    sheet.className = 'sheet';
    for (var j = i; j < i + 4; j++) {
      sheet.appendChild(quarters[j] || Object.assign(document.createElement('div'), { className: 'quarter' }));
    }
    sheets.appendChild(sheet);
  }

  // A new course invalidates any round in progress — restart it.
  if (play) startPlay();
}

function randomSeed() {
  var words = ['birdie', 'bogey', 'eagle', 'albatross', 'divot', 'mulligan',
    'caddie', 'wedge', 'bunker', 'fescue', 'links', 'dimple', 'fore', 'chip'];
  return words[Math.floor(Math.random() * words.length)] + '-' +
         Math.random().toString(36).slice(2, 7);
}

// Populate the theme and difficulty selectors from the generator's
// registries.
(function () {
  var sel = document.getElementById('theme');
  Object.keys(G.THEMES).forEach(function (key) {
    var opt = document.createElement('option');
    opt.value = key;
    opt.textContent = G.THEMES[key].label;
    sel.appendChild(opt);
  });
  var dsel = document.getElementById('diff');
  Object.keys(G.DIFFICULTIES).forEach(function (key) {
    var opt = document.createElement('option');
    opt.value = key;
    opt.textContent = G.DIFFICULTIES[key].label;
    dsel.appendChild(opt);
  });
  dsel.value = 'standard';
})();

document.getElementById('random').addEventListener('click', function () {
  document.getElementById('seed').value = randomSeed();
  rebuild();
});
document.getElementById('seed').addEventListener('change', rebuild);
document.getElementById('theme').addEventListener('change', rebuild);
document.getElementById('diff').addEventListener('change', rebuild);
document.getElementById('holes').addEventListener('change', rebuild);
document.getElementById('paper').addEventListener('change', function (e) {
  var a4 = e.target.value === 'a4';
  document.body.classList.toggle('a4', a4);
  document.getElementById('page-size').textContent =
    '@page { size: ' + (a4 ? 'A4' : 'letter') + '; margin: 0; }';
});
document.getElementById('print').addEventListener('click', function () { window.print(); });

// Restore state from the URL so course links are shareable.
var bootParams = new URLSearchParams(location.search);
document.getElementById('seed').value = bootParams.get('seed') || randomSeed();
if (bootParams.get('theme') && G.THEMES[bootParams.get('theme')]) {
  document.getElementById('theme').value = bootParams.get('theme');
}
if (bootParams.get('diff') && G.DIFFICULTIES[bootParams.get('diff')]) {
  document.getElementById('diff').value = bootParams.get('diff');
}
if (bootParams.get('holes') === '9') document.getElementById('holes').value = '9';
rebuild();
// ?play=1 deep-links straight into a round of the shared course.
if (bootParams.get('play') === '1') startPlay();
</script>
</body>
</html>
